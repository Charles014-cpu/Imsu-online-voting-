<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voting Successful</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 700px; background: white; padding: 45px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
        h1 { color:green; border-bottom: 5px solid #eee; padding-bottom: 10px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0056b3; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #004085; }
        .result { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .hidden { display: none; }
    </style>
    <link rel="stylesheet" href="success.css">

</head>


<body>


    <div class="container">

        <div class="success-box">


            <div class="check">

            </div>
 <h1>Voting Successful ✓  </h1>
            <button onclick="logout()">

                Logout

            </button>


        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script>


        // Display the candidate that was selected

        let candidate =
            localStorage.getItem("candidate");


        document.getElementById("candidateName").innerHTML =

            "You voted for: " + candidate;



        // LOGOUT FUNCTION

        function logout() {


            localStorage.removeItem("email");

            localStorage.removeItem("matric");

            localStorage.removeItem("candidate");


            window.location.href = "index.html";

        }


    </script>


</body>

</html>
